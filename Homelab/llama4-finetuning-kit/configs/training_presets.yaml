# Training Configuration Presets for Llama-4 Fine-Tuning

# Default configuration for 24GB VRAM (RTX 4090, RTX 3090)
default_24gb:
  model_name: "unsloth/Llama-4-8B-Instruct-bnb-4bit"
  max_seq_length: 8192
  load_in_4bit: true
  
  lora:
    r: 64
    alpha: 32
    dropout: 0.05
    use_rslora: true
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  
  training:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    num_train_epochs: 1
    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    optim: "adamw_8bit"
    packing: true
    seed: 42
    
  logging:
    logging_steps: 10
    save_steps: 100
    save_total_limit: 3


